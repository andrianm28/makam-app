<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustrasi batu nisan granit (placeholder)">
  <title>Batu Nisan Granit — placeholder</title>
  <rect width="400" height="300" rx="16" fill="#ECEAE7"/>
  <!-- ground line -->
  <line x1="90" y1="240" x2="310" y2="240" stroke="#A6A199" stroke-width="4" stroke-linecap="round"/>
  <!-- base plinth -->
  <rect x="150" y="222" width="100" height="18" rx="3" fill="none" stroke="#4B4640" stroke-width="4"/>
  <!-- headstone silhouette, rounded top -->
  <path d="M160 222 L160 130 Q200 90 240 130 L240 222 Z" fill="none" stroke="#4B4640" stroke-width="4" stroke-linejoin="round"/>
  <!-- granite flecks -->
  <g fill="#8A8580">
    <circle cx="180" cy="150" r="2.2"/>
    <circle cx="200" cy="140" r="2"/>
    <circle cx="218" cy="160" r="2.4"/>
    <circle cx="190" cy="180" r="2"/>
    <circle cx="212" cy="195" r="2.2"/>
    <circle cx="175" cy="205" r="2"/>
  </g>
</svg>
