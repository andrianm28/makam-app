  only.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Ilustrasi jalan setapak taman pemakaman contoh">
  <title>Ilustrasi contoh - jalan setapak</title>
  <rect x="0" y="0" width="400" height="300" fill="#eef2ea"/>
  <rect x="0" y="0" width="400" height="200" fill="#e2ecdf"/>
  <rect x="0" y="200" width="400" height="100" fill="#a9c9a5"/>
  <path d="M0 200 Q 200 178 400 200 L400 218 Q200 200 0 218 Z" fill="#95bb90"/>
  <!-- winding path across the whole scene -->
  <path d="M0 260 C 80 250, 100 220, 170 215 C 230 210, 250 180, 330 170 C 370 165, 385 150, 400 140"
        fill="none" stroke="#d8cdb8" stroke-width="22" stroke-linecap="round"/>
  <path d="M0 260 C 80 250, 100 220, 170 215 C 230 210, 250 180, 330 170 C 370 165, 385 150, 400 140"
        fill="none" stroke="#e6ddc9" stroke-width="10" stroke-linecap="round"/>
  <!-- low shrubs along the path -->
  <circle cx="60" cy="245" r="14" fill="#7bab74"/>
  <circle cx="120" cy="232" r="12" fill="#6f9e6a"/>
  <circle cx="220" cy="196" r="14" fill="#7bab74"/>
  <circle cx="300" cy="176" r="12" fill="#6f9e6a"/>
  <circle cx="360" cy="152" r="13" fill="#7bab74"/>
