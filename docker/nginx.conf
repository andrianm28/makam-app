# nginx config for the makam-app runtime image (see ../Dockerfile,
# ../docker/docker-entrypoint.sh). Serves resources/public/ static files and
# proxies .php requests to php-fpm over loopback (same container).
#
# Runs as www-data (Dockerfile USER, not root) on an unprivileged port
# (8080), so no bind/setuid capability is needed. PID and temp paths are
# under /tmp because /run and /var/lib/nginx are not writable by www-data —
# see the Dockerfile's `mkdir -p /tmp/nginx-*` step.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # All five of nginx's default temp paths, not just the three this config
    # actually uses (client_body/proxy/fastcgi) — nginx initializes uwsgi/scgi
    # temp dirs unconditionally at startup regardless of whether any uwsgi/scgi
    # directive appears below. First real container run crash-looped on
    # "mkdir() /var/lib/nginx/uwsgi failed (13: Permission denied)" because
    # only the first three were covered here.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Booking Step 7 accepts KTP/KK/death-certificate uploads (§ deployment
    # notes in docs/operations/examples/nginx/dev.makam.co.id.conf, which
    # allows 12m at the host reverse-proxy layer). Slightly above that here
    # so this layer is never the tighter limit.
    client_max_body_size 15m;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS off;
        }

        # No dotfiles served (.env, .git, etc.) — defence in depth; none of
        # these should exist under public/ in the first place.
        location ~ /\. {
            deny all;
        }
    }
}
