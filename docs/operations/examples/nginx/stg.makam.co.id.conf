# stg.makam.co.id — combined development/staging environment
#
# Owner doc:  docs/operations/dev-staging-environment.md (line 32, §5 line 76)
# Sprint task: S2-T5 (docs/planning/sprint-plan.md), human gate G3
# Runbook:     docs/operations/runbooks/deploy-stg-vhost.md
#
# Access control is MANDATORY here and is UNCHANGED by ADR-0031.
# dev-staging-environment.md §5 line 76:
#   "stg.makam.co.id: limited stakeholder/UAT access; authentication
#    required where appropriate." ADR-0031 (docs/adr/0031) reversed the
#    equivalent requirement for dev.makam.co.id ONLY; §5 says explicitly
#    that line is "Unaffected by the note below — this line still applies
#    to staging as originally written."
#
# Mechanism: HTTP basic auth, the same mechanism dev used before ADR-0031.
# docs/operations/ai-agent-dev-stg-setup-variables.env.example defines
# ALLOWED_DEV_IPS for an IP-allowlist alternative on dev, but as of this
# writing it does NOT define an ALLOWED_STG_IPS (or equivalent) variable —
# there is no allowlist mechanism available for staging in that file. Basic
# auth is used here because it is the only access-control mechanism the
# variables file actually supports today. If an ALLOWED_STG_IPS variable is
# added later, replace the auth_basic block with allow/deny directives,
# mirroring the note already carried in dev.makam.co.id.conf.
#
# Upstream is the stg-placeholder container until the Laravel image exists.
# The port does not change when the real app lands (see /opt/makam/compose,
# same reasoning as dev.makam.co.id.conf's own upstream note).

server {
    listen 80;
    listen [::]:80;
    server_name stg.makam.co.id;

    # ACME HTTP-01 must bypass basic auth or certificate issuance and renewal
    # both fail with 401. This is the one location that is deliberately open.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stg.makam.co.id;

    # Certificate is added by Certbot on first issuance. Until then this block
    # is inert because nginx has no cert to bind — see the deployment note in
    # docs/planning/sprint-plan.md S2-T5 and the runbook referenced above.
    ssl_certificate     /etc/letsencrypt/live/stg.makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stg.makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Not public — required, unaffected by ADR-0031 --------------------
    auth_basic           "makam.co.id staging — authorised stakeholder/UAT access only";
    auth_basic_user_file /etc/nginx/.htpasswd-stg;

    # --- Never indexed ---------------------------------------------------
    # release-gates.md §I requires dev/staging to be access-restricted and
    # noindex. `always` so the header survives 4xx and 5xx responses too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # --- Security headers -------------------------------------------------
    # No HSTS on this host: a non-production subdomain must not be able to
    # pin the browser for the whole makam.co.id domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # Non-production environments are noisier; keep the log separate so
    # production log analysis is not polluted.
    access_log /var/log/nginx/stg.makam.co.id.access.log;
    error_log  /var/log/nginx/stg.makam.co.id.error.log warn;

    # Uploads: booking Step 7 accepts KTP/KK/death certificates.
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering    off;   # Livewire streams; buffering delays updates
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
