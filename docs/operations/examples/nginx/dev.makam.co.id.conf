# dev.makam.co.id — combined development environment
#
# Owner doc:  docs/operations/dev-staging-environment.md (line 32, line 75)
# Sprint task: S2-T5 (docs/planning/sprint-plan.md), human gate G3
#
# Access control is MANDATORY here. dev-staging-environment.md line 75:
#   "dev.makam.co.id: VPN, IP allowlist, or reverse-proxy authentication;
#    not public."
# Basic auth is used because no VPN exists and the operator IP set is unknown.
# To switch to an IP allowlist later, populate ALLOWED_DEV_IPS (see
# docs/operations/ai-agent-dev-stg-setup-variables.env.example) and replace the
# auth_basic block with allow/deny directives.
#
# Upstream is the dev-placeholder container until the Laravel image exists.
# The port does not change when the real app lands (see /opt/makam/compose).

server {
    listen 80;
    listen [::]:80;
    server_name dev.makam.co.id;

    # ACME HTTP-01 must bypass basic auth or certificate issuance and renewal
    # both fail with 401. This is the one location that is deliberately open.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.makam.co.id;

    # Certificate is added by Certbot on first issuance. Until then this block
    # is inert because nginx has no cert to bind — see the deployment note in
    # docs/planning/sprint-plan.md S2-T5.
    ssl_certificate     /etc/letsencrypt/live/dev.makam.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.makam.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Not public ------------------------------------------------------
    auth_basic           "makam.co.id development — authorised access only";
    auth_basic_user_file /etc/nginx/.htpasswd-dev;

    # --- Never indexed ---------------------------------------------------
    # release-gates.md §I requires dev/staging to be access-restricted and
    # noindex. `always` so the header survives 4xx and 5xx responses too.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # --- Security headers -------------------------------------------------
    # No HSTS on this host: a non-production subdomain must not be able to
    # pin the browser for the whole makam.co.id domain.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "no-referrer" always;

    # Non-production environments are noisier; keep the log separate so
    # production log analysis is not polluted.
    access_log /var/log/nginx/dev.makam.co.id.access.log;
    error_log  /var/log/nginx/dev.makam.co.id.error.log warn;

    # Uploads: booking Step 7 accepts KTP/KK/death certificates.
    client_max_body_size 12m;

    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering    off;   # Livewire streams; buffering delays updates
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
