- id: DEP-01
  dim: DEP
  severity: Medium
  category: "supply-chain"
  effort: M
  audit_verdict: PARTIALLY_CONFIRMED
  status: open
  status_evidence: []
  status_verified: false
  files:
    - "Dockerfile:93"
    - "Dockerfile:42"
    - "Dockerfile:72"
  statement: >-
    The runtime base image is pinned by digest at Dockerfile:93 to a 2026-07-14 php:8.5-fpm-bookworm
    build (PHP 8.5.8), two patch releases behind the current tag (8.5.10), and the repository has no
    mechanism that would ever surface the drift — no dependabot or renovate config, no `schedule:`
    trigger in ci.yml, and no scanner consuming the SBOM it generates; none of the CVEs fixed in
    8.5.9/8.5.10 have a demonstrated reachable path in this application (no ext-exif or ext-gd
    compiled in, no html-sanitizer call site, no pg_escape_*/pg_query or bcmath call sites), so the
    exposure is a missing patch-cadence control rather than an active vulnerability.
  recommendation: >-
    Add /home/ubuntu/makam-app/.github/dependabot.yml with a `docker` ecosystem entry on `/`
    (weekly) so the Dockerfile:93 digest pin gets automated refresh PRs, and add a `schedule:`
    (weekly cron) trigger plus a Trivy or Grype image-scan step to .github/workflows/ci.yml that
    fails on HIGH/CRITICAL against the built image, consuming the SBOM already produced at
    ci.yml:766-778. Note that promotion still requires the self-hosted runner
    (deploy-dev/deploy-beta are gated on vars.MAKAM_DEPLOY_RUNNER_ACTIVE), so the runbook must be
    executed for rebuilt images to actually reach dev/beta.

