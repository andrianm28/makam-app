    ScanVerdict::Clean result promotes the document through the existing PromoteDocument action
    (move the object from quarantine to the clean prefix, transition Scanning -> Accepted, emit
    document.accepted.v1 and the DOCUMENT_ACCEPTED audit row) rather than leaving the row in
    Scanning — either by injecting PromoteDocument and calling it after the scan record commits, or
    by dispatching a PromoteDocumentJob on the same media queue; add a feature test that drives
    ScanDocumentJob::handle() end-to-end and asserts DocumentState::Accepted, plus a reconciliation
    command that reports documents stuck in SCANNING beyond a th

