    BookingWizard::render() consults only paymentMode(), so with G-PAY-01 closed a PRE_NEED draft
    reaches the generic 'Pembayaran Manual' card instructing a bank transfer, and
    SaveBookingDraftStep::validatePayment() has no service_type predicate to refuse MANUAL on a
