- id: DOM-02
  dim: DOM
  severity: Low
  category: "atomicity / state-machine"
  effort: S
  audit_verdict: PARTIALLY_CONFIRMED
  status: open
  status_evidence: []
  status_verified: false
  files:
    - "app/Domain/OrderWorkflow/Actions/IssueOrderQuote.php:39"
    - "app/Domain/Quotation/Actions/IssueQuote.php:127"
    - "app/Domain/OrderWorkflow/Actions/RecordBuyerApproval.php:20"
  statement: >-
    IssueOrderQuote composes two independently-committed transactions (IssueQuote, then
    RecordOrderStatusChange) with no enclosing transaction and no assertion on the order's source
    status, unlike its sibling RecordBuyerApproval which wraps both, so a failure or concurrent
    write between them can leave an orphaned or needlessly superseded quote row while the order
    status is unchanged. The source-status precondition is enforced only incidentally, by Filament
    re-deriving header actions from a freshly re-queried record on each request, so the transition
    can never be mounted for an order that has already advanced — the destructive 'stale tab
    supersedes an accepted quote' outcome is not reachable through any surface in the deployed
    panel.
  recommendation: >-
    In app/Domain/OrderWorkflow/Actions/IssueOrderQuote.php, wrap the ($this->issueQuote)(...) and
    RecordOrderStatusChange calls in a single DB::transaction, and add an explicit source-status
    precondition at the top (assert $order->status() is one of the states from which
    PENAWARAN_TERKIRIM is legal, throwing IllegalOrderTransitionException otherwise) — mirroring
    IssueQuoteFromReservedPlot.php:88 and RecordBuyerApproval.php:33 rather than relying on the UI
    layer to derive the legal edge.

