- id: PERF-04
  dim: PERF
  severity: Low
  category: "deployment-config"
  effort: M
  audit_verdict: PARTIALLY_CONFIRMED
  status: open
  status_evidence: []
  status_verified: false
  files:
    - "Dockerfile:206"
    - "docker/docker-entrypoint.sh:23"
    - ".github/workflows/ci.yml:810"
  statement: >-
    The deployed image ships with no config, route or view cache (bootstrap/cache/ contains only
    packages.php and services.php from Dockerfile:206-208, and neither docker-entrypoint.sh nor the
    deploy jobs run `artisan optimize`), so every request re-parses config/ and re-registers the
    route table; measured response times are 67-186 ms against the documented 500 ms p95 budget, so
    no SLO is breached, and `route:cache` cannot be enabled today at all because routes/web.php:196
    and :286 register Closure route actions.
  recommendation: >-
    In /home/ubuntu/makam-app/Dockerfile, extend the RUN at line 206-208 with `php artisan
    view:cache` (safe and build-time immutable); leave config:cache out of the build (config comes
    from runtime secrets) and instead add `docker compose exec web php artisan config:cache` to the
    deploy-dev/deploy-beta steps in .github/workflows/ci.yml, documenting that it lands in the
    writable layer and must re-run on every `docker compose up -d`. Only after refactoring the two
    query-string-preserving redirects at routes/web.php:196 and :286 into invokable controllers
    should `route:cache` be added.

