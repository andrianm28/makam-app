    audit_events FOR EACH ROW` (and the same on document_access_events), guarded by
    `DB::connection()->getDriverName() === 'pgsql'`; then flip
    tests/Feature/Audit/AuditEventAppendOnlyTest.php:105-112 from asserting the bypass succeeds to
    expecting a QueryException, and update the ⚠️ partial S3-T8 entry in
    docs/planning/sprint-plan.md:599.

