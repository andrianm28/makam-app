    requires a deceased name, date of birth and non-future date of death, and no bank-transfer
    destination is configured on dev or beta, and no invoice or payment object is ever created for
    PRE_NEED (SubmitBookingDraft routes it to RegisterPreNeedInterest), so the closed-gate financial
    invariant itself holds.
