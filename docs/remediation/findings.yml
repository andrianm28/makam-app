- id: MKT-01
  dim: MKT
  severity: High
  category: "authorization"
  effort: S
  audit_verdict: CONFIRMED
  status: resolved
  status_evidence: [merged#249]
  status_verified: false
  files:
    - "app/Livewire/Public/Marketplace/OrderTracking.php:59"
    - "app/Livewire/Public/Marketplace/Checkout.php:102"
    - "app/Livewire/Public/Booking/BookingWizard.php:97"
  statement: >-
    OrderTracking and Checkout (app/Livewire/Public/Marketplace/) expose $customerRef, $orderNumber,
    $orderPlaced and $placedOrderNumber as unlocked public Livewire properties on unauthenticated
    public routes (routes/web.php:158-159), so a client can overwrite them in the /livewire/update
    payload; MarketplaceOrderQuery::findForCustomer() and SubmitManualPayment::submit()
    (app/Platform/Payment/SubmitManualPayment.php:117) perform no independent ownership check,
    letting anyone who obtains a foreign order number read that order's items, prices and totals,
    flip its vendor order to KOMPLAIN with attacker-authored notes, and file a manual payment proof
    against it. The unguessable 10-char order number is a genuine precondition, customer_ref
    enumeration works only against signed-in victims, and the fraudulent-payment leg still requires
    a finance operator to approve an unmatchable proof.
  recommendation: >-
    Add #[Locked] to $customerRef and $orderNumber in
    app/Livewire/Public/Marketplace/OrderTracking.php:59-63 and to
    $idempotencyKey/$onlinePaymentAllowed/$orderPlaced/$placedOrderNumber in Checkout.php:102-113,
    and — as defence in depth — re-derive the customer reference from auth()/session() inside
    render(), fileComplaint() and submitManualProof() rather than reading the property, plus give
    SubmitManualPayment::submit() a required customerRef parameter it matches against
    $order->customer_ref before creating the PaymentVerification. Add feature tests that set() the
    properties post-mount and assert non-disclosure and no write.

