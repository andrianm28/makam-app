    - "bootstrap/app.php:30"
    - "app/Platform/DocumentVault/Jobs/CleanupPromotedDocumentStorageJob.php:134"
  statement: >-
    ReconcileDocumentStorageCleanupJob::handle() scans every document in a non-'accepted' storage
    prefix with no window, watermark or limit, opening a transaction with two row locks per
    document, and the candidate set grows monotonically because terminal states never leave the
    predicate; it is scheduled every five minutes onto the 'media' queue, which no deployed
    container consumes today, so the load is latent rather than current — and will fire as a backlog
    of accumulated full scans the moment a media worker is added.
  recommendation: >-
    In app/Platform/DocumentVault/Jobs/ReconcileDocumentStorageCleanupJob.php bound the scan: add a
    per-run limit (e.g. ->limit(500)) with a resumable watermark (order by updated_at/id, persist
    the cursor) or restrict to rows whose state changed within a recent window, and add
    ShouldBeUnique to the job class so queued copies coalesce. Add a composite index on
    (storage_prefix, state) in a new migration. Land this before or with the QUE-01 media-consumer
    change.

