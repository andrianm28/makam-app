    - "app/Support/Migrations/DestructiveMigrationScanner.php:34"
    - ".github/workflows/ci.yml:55"
  statement: >-
    The destructive-migration CI gate has two blind spots: DestructiveMigrationScanner scans only
    the text between up() and down(), so destructive statements in a private helper declared after
    down() are invisible, and its pattern lists omit ->change(), renameColumn, DROP CONSTRAINT,
    dropPrimary and ALTER COLUMN — 8 in-repo migrations already use DROP CONSTRAINT and 2 use
    ->change() and all pass clean. Both gaps match the approved spec, and AGENTS.md's mandatory
    human review still stands in front of them, so the practical risk is the false assurance of
    ci.yml's comment describing the gate as the automated replacement for reading every migration.
  recommendation: >-
    In app/Support/Migrations/DestructiveMigrationScanner.php, scan the whole file with only
    down()'s brace-matched body excluded (handling both declaration orders — today, when down()
    precedes up(), the slice runs from up() to EOF and can false-positive on nothing but would miss
    the reverse case), and extend DESTRUCTIVE_METHOD_PATTERNS/DESTRUCTIVE_SQL_PATTERNS with
    '->change(', 'renameColumn', 'dropPrimary', 'DROP CONSTRAINT' and 'ALTER COLUMN ... TYPE', with
    the existing override annotation available for the safe widening migrations already in-repo.
    Soften the .github/workflows/ci.yml:49-51 comment so it no longer claims to replace the
    mandatory human read, and record the widened scope back in

- id: DB-02
  dim: DB
  severity: Medium
  category: "migration-delivery-ordering"
  effort: M
  audit_verdict: PARTIALLY_CONFIRMED
  status: open
  status_evidence: []
  status_verified: false
  files:
    - ".github/workflows/ci.yml:819"
    - ".github/workflows/ci.yml:884"
  statement: >-
    The dev and beta deploy jobs start the new container before running migrations (ci.yml:828->834,
    :893->899), which does not invert the canonical sequence (ci-cd-and-release.md:80-82 puts code
    before migrations) but does collapse its step 4 and step 6: with `docker compose up -d` the new
    code begins serving public traffic during the migration window, so any release that is not
    forward-compatible — e.g. PR #235, which adds `memorial_visit_checkins` and the Livewire code
    reading it in one commit — serves 500s for that window, and the job has no rollback on a failed
    `migrate --force` (an approved decision, cicd-automation-design.md:50 §5). The cited job cannot
    execute today (MAKAM_DEPLOY_RUNNER_ACTIVE unset, no self-hosted runner, compose.yml still pins
    literal digests, and `git add .env` in a non-repo aborts the step), so this is latent in
    automation that will inherit it the moment setup-ci
  recommendation: >-
    In .github/workflows/ci.yml, run migrations against the new image before it takes traffic: use a
    one-shot `docker compose run --rm --no-deps <svc> php artisan migrate --force` (or exec into the
    existing container) as its own step BEFORE `docker compose up -d`, and guard `git add .env`
    (`git -C /opt/makam/compose add .env || true`, or make Step 6's `git init` a precondition of the
    job). Land this in the same change as runbook Step 5's compose.yml
    ${APP_IMAGE_DEV}/${APP_IMAGE_BETA} parameterisation, and mirror the corrected ordering into
    docs/operations/deployment.md §5 and runbooks/deploy-production.md Steps 3-4.

