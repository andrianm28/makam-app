# Ledger temuan audit teknik 6 September 2026 — SUMBER KEBENARAN TUNGGAL
#
# Dihasilkan oleh W0 (lihat docs/remediation/README.md). Sebelum file ini ada,
# satu-satunya salinan 343 temuan berada di scratchpad sesi yang ephemeral, di
# luar version control — sehingga program remediasi tidak bisa dihentikan
# dengan aman tanpa kehilangan catatan sisa pekerjaan.
#
# ATURAN:
#   - Jangan duplikasi isi file ini ke dokumen lain (AGENTS.md §Documentation).
#     Dokumen lain merujuk id-nya, tidak menyalin pernyataannya.
#   - `status` hanya boleh naik: open -> in_review -> resolved.
#   - `status_verified: false` berarti status diturunkan dari rujukan id di
#     badan PR, BUKAN dari verifikasi ulang. Naikkan ke true hanya setelah
#     seseorang benar-benar memastikan temuannya tertutup.
#
# status:
#   open       — belum ada PR yang menyebut id ini
#   in_review  — disebut oleh PR yang masih terbuka
#   mitigated  — stop-gap/alert sudah terpasang, perbaikan permanen belum
#   resolved   — hanya disebut oleh PR yang sudah merge
#
# `status_note` hadir bila status dikoreksi manual dari derivasi regex; isinya
# kutipan dari badan PR yang jadi dasarnya.

- id: CI-01
  dim: CI
  severity: Critical
  category: "data-loss / backup"
  effort: M
  audit_verdict: CONFIRMED
  status: mitigated
  status_evidence: [host-action-2026-09-13]
  status_verified: true
  status_note: >-
    PR #240 hanya menyebut CI-01 sebagai pekerjaan terpisah: 'CI-01 (production backup), SEC-02
    (bank-transfer re-auth) - the other two Critical findings, separate PRs.' Backup makam_beta
    adalah aksi host yang dieksekusi manusia. DIKERJAKAN 13 September 2026 atas persetujuan
    pemilik: (1) dump pertama makam_beta yang pernah ada diambil, 6,7 MB; (2) dump itu
    DIPULIHKAN ke database sementara makam_beta_restoretest dan diverifikasi identik dengan
    sumbernya - 10 orders, 56 booking_drafts, 11 users, 280 audit_events, 123 tabel - lalu
    database ujinya dihapus; (3) makam_beta ditambahkan ke loop /opt/makam/scripts/pg-backup.sh
    (sebelumnya hanya makam_dev + makam_stg) dan skripnya dijalankan sekali end-to-end;
    (4) kadensi /etc/cron.d/makam-pg-backup dinaikkan dari harian 03:00 menjadi tiap 6 jam.
    Skrip dan cron lama dicadangkan sebagai .bak-<timestamp> sebelum disunting.
    TETAP `mitigated`, BUKAN `resolved`: dump masih tidak terenkripsi dan masih berada di disk
    yang sama dengan databasenya, sehingga satu kegagalan disk tetap menghapus keduanya. Enkripsi
    dan pengiriman ke luar disk menunggu keputusan pemilik soal tujuan penyimpanan, dan
    ci/verify-infra.sh belum punya gate yang memastikan artefak beta lebih baru dari RPO.
  files:
    - "docs/operations/database-backup-and-recovery.md:122"
    - "/opt/makam/scripts/pg-backup.sh:1"
    - "docs/operations/dev-staging-environment.md:214"
  statement: >-
    The only backup producer on the deployment host, /opt/makam/scripts/pg-backup.sh:17, loops over
    makam_dev and makam_stg only, so the live production database makam_beta has never been dumped
    (zero *beta* artefacts in /opt/makam/backups/pg) — despite
    docs/operations/database-backup-and-recovery.md:124-129 asserting 4–6 hourly encrypted snapshots
    with a tested restore as the strategy already established for beta, and ci/verify-infra.sh
    containing no gate that would detect the absence; the dev/stg dumps that do exist are
    unencrypted .sql.gz on the same disk as the database.
  recommendation: >-
    Human-reviewed change on the deployment host (AGENTS.md §Infrastructure-agent execution:
    production/destructive-adjacent). Add makam_beta to the loop in
    /opt/makam/scripts/pg-backup.sh:17, raise the cadence for beta from daily to 4-6 hourly in
    /etc/cron.d/makam-pg-backup, encrypt the output and ship it off this disk per
    docs/operations/database-backup-and-recovery.md §4, perform and record one tested restore into a
    scratch database, then add a check to ci/verify-infra.sh asserting a makam_beta artefact newer
    than the declared RPO exists. Correct docs/operations/database-backup-and-recovery.md:16-21,
    which currently claims the strategy already ran for beta.

