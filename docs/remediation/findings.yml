- id: CI-02
  dim: CI
  severity: High
  category: "data-loss / container configuration"
  effort: M
  audit_verdict: CONFIRMED
  status: open
  status_evidence: []
  status_verified: true
  status_note: >-
    PR #247: 'CI-02 and COORD-17 are intentionally not implemented'. Perubahan volume storage/app
    hidup di /opt/makam/compose/compose.yml, di luar repositori ini.
  files:
    - "config/filesystems.php:16"
    - ".github/workflows/ci.yml:884"
    - "docs/operations/dev-staging-environment.md:267"
  statement: >-
    None of the four application services in /opt/makam/compose/compose.yml (dev-web, beta-web,
    beta-worker, beta-scheduler) declare any volume or bind mount, while config/filesystems.php:35
    and LocalFilesystemObjectStorage.php:161 place every uploaded object under
    storage_path('app/private'|'app/public') inside the container's writable layer — so each
    redeploy that recreates a container permanently destroys vendor work-order evidence, admin
    certificate PDFs, provider reconciliation statements and marketplace product images, leaving
    orphaned database rows and 404s with no backup coverage
    (docs/operations/backup-and-restore-runbook.md:55 states storage is not backed up).
  recommendation: >-
    In /opt/makam/compose/compose.yml add a named volume (e.g. `beta_storage:` and `dev_storage:` in
    the top-level `volumes:` block at line 570) and mount it as `-
    beta_storage:/var/www/html/storage/app` on beta-web, beta-worker and beta-scheduler (and the dev
    equivalent on dev-web), ensuring uid/gid match the container's php-fpm user; then add
    storage/app to the backup runbook's covered set in docs/operations/backup-and-restore-runbook.md
    and record the change in the deployment descriptor's comment trail. Before the first mount,
    treat existing container-layer objects as already lost and reconcile the `documents` rows. Human
    review is mandatory (production-affecting, per AGENTS.md).

- id: CI-03
  dim: CI
  severity: High
  category: "container build / production hardening"
  effort: S
  audit_verdict: PARTIALLY_CONFIRMED
  status: resolved
  status_evidence: [merged#247]
  status_verified: false
  files:
    - "Dockerfile:137"
    - "app/Platform/DocumentVault/DocumentKind.php:46"
    - "docker/nginx.conf:39"
  statement: >-
    The deployed runtime image (Dockerfile:93, no php.ini installed and no php.ini/PHP_INI override
    in /opt/makam/compose/compose.yml) runs on PHP defaults of upload_max_filesize=2M,
    post_max_size=8M and expose_php=1, so four authenticated upload surfaces that declare a 10 MB
    cap — vendor work-order evidence photos (UploadEvidenceAction.php:85-92, required), admin
    certificate PDFs (CreateCertificateAction.php:112-118, required), product images
    (ProductForm.php:127-133) and memorial media (MemorialFamilyPage.php:198) — silently truncate at
    2 MB with a generic Livewire 422 and no audit record. There is no booking-wizard, grave-import
    or payment-proof upload path affected, and display_errors is neutralised at framework bootstrap.
  recommendation: >-
    Add a PHP ini fragment to the runtime stage of /home/ubuntu/makam-app/Dockerfile beside the
    existing opcache.ini block (around line 181-187): write /usr/local/etc/php/conf.d/zz-makam.ini
    with upload_max_filesize=12M, post_max_size=14M (both under docker/nginx.conf:43
    client_max_body_size 15m), memory_limit=256M and expose_php=Off. Then add a build-time or CI
    assertion that ini_get('upload_max_filesize') is >= the largest maxSize() actually wired to a UI
    (10 MB today, not DocumentKind's 50 MB), so the two limits cannot drift apart again.

- id: CI-05
  dim: CI
  severity: High
  category: "ci gating"
  effort: S
  audit_verdict: PARTIALLY_CONFIRMED
  status: mitigated
  status_evidence: [merged#247]
  status_verified: true
  status_note: >-
    PR #247 menyelesaikan sisi-repo saja ('CI-05 (repo-side only)'): target branch ci.yml dan
    koreksi git-workflow.md. Branch protection tetap aksi manusia yang belum dijalankan.
  files:
    - ".github/workflows/ci.yml:25"
    - "docs/operations/ci-cd-and-release.md:32"
    - "docs/operations/runbooks/setup-cicd-self-hosted-runner.md:149"
  statement: >-
    Trunk (`docs/design-system-and-planning`) has no branch protection and no ruleset
    (`/branches/.../protection` -> 404, `/rulesets` -> []), so ci-cd-and-release.md:32's normative
    "Pull requests cannot merge when required checks fail" is false: nothing prevents merging a PR
    whose checks are red or absent, as PR #239 demonstrates (merged with 'Dependency audit'
    failing). Compounding it, ci.yml:24-26's `ci-${{ github.ref }}` concurrency group lets GitHub
    evict older *pending* trunk runs, so ten trunk commits (six of them the divergent merge commits
    #232-#237) carry no CI verdict of their own — they were never built or deployed, since a
    cancelled run never reaches build-image, but they are unverified history; and ci.yml:20-22 fires
    `pull_request` only for `branches: [master]`, so on this now-public repo a fork PR into trunk
    can reach the merge button with no check runs at all.
  recommendation: >-
    Execute setup-cicd-self-hosted-runner.md Step 6 as written (the branch-protection PUT with its
    nine required contexts plus one required review) — it is executable today because the repo is
    public, so update docs/planning/git-workflow.md:24 §0/§4/§8 OQ-G1 to drop the stale 'private on
    Free plan, protection is gated' premise. In .github/workflows/ci.yml, change the concurrency
    group for the trunk ref to be per-SHA (e.g. `group: ci-${{ github.ref }}-${{ github.sha }}`, or
    drop the group for trunk) so queued trunk runs are never evicted, and extend the `pull_request:`
    trigger at :20-22 from `branches: [master]` to include the trunk branch so PRs into trunk get
    their own check runs.

